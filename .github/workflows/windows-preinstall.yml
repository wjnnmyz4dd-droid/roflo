# DeskPilot on Windows: the tests that cannot be run from Linux.
#
# Everything in `docs/deskpilot-windows-compatibility.md` marked
# UNVERIFIED ON WINDOWS is unverified because this workflow has never
# run. It exists so that the gap closes by being executed rather than by
# being argued about.
#
# It installs nothing on anybody's laptop and contacts no marketplace:
# the runner is disposable, egress stays simulated, and no credential is
# supplied to it.
name: windows-preinstall

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'solvent/**'
      - 'tests_solvent/**'
      - '.github/workflows/windows-preinstall.yml'

jobs:
  suite-on-windows:
    name: Suite on Windows (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the installer enforces; 3.13 is what it
        # bootstraps. Both are run because a floor nobody tests is a
        # floor nobody knows holds.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Record the environment
        shell: pwsh
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform()); print('64-bit:', sys.maxsize > 2**32)"
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Output "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"

      # pytest is in the `dev` extra, not `verification`. Leaving it out
      # is what made the first three runs of this workflow fail at the
      # first test step with "No module named pytest" -- and the steps
      # after it were skipped, so the failure hid every other result.
      - name: Install the verification extras and the test runner
        run: python -m pip install --disable-pip-version-check -e ".[verification,dev]"

      # Which formats this Windows machine can give a second opinion on.
      # Recorded before the suite so it is in the log even when a test
      # fails: the T2 question is the one this workflow exists to settle.
      - name: Independent (T2) readers available on Windows
        if: always()
        shell: pwsh
        run: |
          python -c @"
          from solvent import independent
          for extension in sorted(independent._DIFFERENTIAL_READERS):
              report = independent.available(extension=extension)
              for producer in report.producers:
                  print(extension, '|', producer.name, '| usable=' + str(producer.usable),
                        '| needs_a_person=' + str(producer.needs_a_person),
                        '|', producer.why)
          "@

      # cmd.exe, not pwsh, and that is the point of this step's shape.
      #
      # The previous two attempts both lost the end of the run: the
      # tee'd version stopped at 60%, the redirected one at 65%, and in
      # both the step's own `Write-Output "pytest exit code: ..."`
      # never reached the archived log either. A shell that loses its
      # own echo after the command it ran is a shell whose buffer went
      # with it, so this run removes the shell from the path: cmd.exe's
      # `>` is an OS-level handle on the child process, written by
      # pytest itself with nothing in between to buffer.
      #
      # And the answer no longer depends on stdout at all. --junitxml
      # is written incrementally by pytest and names every test that
      # ran, so even a lost console says which test was last. The exit
      # code goes to a file in the same breath, because a code printed
      # to a stream that disappears is not evidence.
      - name: Full suite
        shell: cmd
        run: |
          python -I -m pytest tests_solvent -p no:randomly -v --color=no --tb=long -rA --junitxml=junit.xml > suite.txt 2>&1
          echo %ERRORLEVEL%> exitcode.txt
          type exitcode.txt
          exit /b 0

      # Separate from the step above so the suite's own exit code
      # cannot stop the diagnosis. Everything measured here is read
      # from files pytest wrote, not from a console that may not have
      # survived.
      - name: What the suite actually did
        if: always()
        shell: pwsh
        run: |
          $code = if (Test-Path exitcode.txt) { (Get-Content exitcode.txt -Raw).Trim() } else { "no file" }
          Write-Output "pytest exit code: $code"
          if (Test-Path suite.txt) {
            $lines = @(Get-Content suite.txt)
            Write-Output "suite.txt: $($lines.Count) line(s), $((Get-Item suite.txt).Length) bytes"
            Write-Output "----- last line written -----"
            Write-Output $lines[-1]
          } else { Write-Output "suite.txt was never created" }
          if (Test-Path junit.xml) {
            [xml]$x = Get-Content junit.xml
            $suite = $x.testsuites.testsuite
            Write-Output ("junit: tests={0} failures={1} errors={2} skipped={3}" -f `
                          $suite.tests, $suite.failures, $suite.errors, $suite.skipped)
            $cases = @($suite.testcase)
            Write-Output "junit recorded $($cases.Count) case(s); last was:"
            Write-Output ("  {0}::{1}" -f $cases[-1].classname, $cases[-1].name)
          } else { Write-Output "junit.xml was never created -- pytest did not reach the end" }
          Write-Output "----- free disk and memory -----"
          Get-PSDrive C | Select-Object Used,Free | Format-List
          Get-CimInstance Win32_OperatingSystem |
            Select-Object FreePhysicalMemory,TotalVisibleMemorySize | Format-List
          if (Test-Path suite.txt) {
            Write-Output "----- suite.txt, last 80 lines -----"
            Get-Content suite.txt -Tail 80
          }
          $code = if (Test-Path exitcode.txt) { (Get-Content exitcode.txt -Raw).Trim() } else { "1" }
          if ($code -ne "0") { exit 1 }

      # Every step below runs even when the suite fails. A single red
      # test must not hide the Windows-only answers this workflow is
      # here to produce -- that is what happened on runs 1 to 3.
      - name: Windows invariants, on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_windows_compatibility.py -q

      - name: The installer's own suite
        if: always()
        run: python -I -m pytest tests_solvent/test_installer_python_bootstrap.py tests_solvent/test_installer_python_discovery.py -q

      - name: State paths resolve to a drive
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import ntpath
          from solvent import harness, runtime
          from solvent.web import intents
          for name, value in (('DEFAULT_DB', runtime.DEFAULT_DB),
                              ('HEARTBEAT_PATH', runtime.HEARTBEAT_PATH),
                              ('PAYMENT_SPOOL', harness.PAYMENT_SPOOL),
                              ('INTENT_SPOOL', intents.INTENT_SPOOL)):
              drive, _ = ntpath.splitdrive(value)
              print(name, value, 'drive=' + repr(drive))
              assert drive, name + ' is drive-relative on Windows: ' + value
          "@

      - name: Python discovery against the real machine
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, 'windows/installer')
          from deskpilot_installer import python_runtime
          from deskpilot_installer.host import WindowsHost
          host = WindowsHost()
          for how, where in python_runtime.search_report(host).items():
              print(how + ':', where)
          found = python_runtime.discover(host)
          for interpreter in found:
              print(interpreter.path, interpreter.version_text,
                    '64-bit' if interpreter.is_64bit else '32-bit',
                    interpreter.rejected or 'usable')
          chosen = python_runtime.choose(found)
          print('chosen:', chosen.path if chosen else 'none')
          assert chosen is not None, 'the runner has Python; discovery must find it'
          "@

      - name: Control centre starts and answers on loopback
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, '.')
          from solvent.web import server
          print('default host:', server.DEFAULT_HOST)
          assert server.DEFAULT_HOST == '127.0.0.1'
          "@

      # The scheduler, on Windows, actually ticking. Not a source read:
      # the business task is constructed and run, and its refusal is
      # printed. Simulation stays on and continuous operation stays off,
      # so this proves the wiring without doing any business.
      - name: The business scheduler ticks on Windows
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, '.')
          from tests_solvent.fixtures import Rig
          from solvent.runtime import Runtime
          runtime = Runtime(Rig())
          runtime.default_tasks()
          names = [task.name for task in runtime.tasks]
          print('tasks:', names)
          assert names.count('business') == 1, names
          print('tick says:', runtime._tick_business())
          status = runtime.business_status()
          print('states:', sorted(status['states']))
          print('connected:', status['business_cycle_connected'],
                'enabled:', status['business_cycle_enabled'])
          "@

      - name: Five-skill smoke test on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_five_skill_library.py -q

      # The real production path, on Windows. The scheduler tick above
      # proves the task is wired; this proves a job goes all the way
      # through it on this operating system -- order, qualification,
      # Governor, Action Gate, worker, checker, delivery, invoice --
      # with nothing substituted. Without it, "Windows startup uses the
      # same real path" would be an assumption rather than a result.
      - name: The production path, end to end, on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_production_path.py -q

      # One pytest process per file, and this time with the tracebacks.
      #
      # The previous version sent per-file output to $null and printed
      # only the exit code, which answered "which files fail" and not
      # "why" -- so eight names came back with nothing to act on. Each
      # file's full output now goes to its own file under per-file/,
      # and every one of them is uploaded.
      #
      # It also records the exit codes themselves rather than only the
      # non-zero ones. An exit code of 1 is pytest saying tests failed;
      # a crash on Windows is 0xC0000005 and reads as a large negative
      # number. Printing both is what lets the two be told apart
      # instead of inferred.
      - name: Every file on its own, with tracebacks
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path per-file | Out-Null
          $bad = @()
          foreach ($f in Get-ChildItem tests_solvent/test_*.py | Sort-Object Name) {
            $name = "tests_solvent/" + $f.Name
            $out = "per-file/" + $f.BaseName + ".txt"
            cmd /c "python -I -m pytest $name -p no:randomly --tb=long -rA --color=no > $out 2>&1"
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              $bad += [pscustomobject]@{ File = $name; Code = $code }
              Write-Output "NONZERO  $name  exit=$code"
            }
          }
          if ($bad.Count -eq 0) {
            Write-Output "every file passes on its own; the failure needs the whole run"
          } else {
            Write-Output "----- $($bad.Count) file(s) failed on their own -----"
            foreach ($row in $bad) {
              Write-Output ""
              Write-Output "================ $($row.File)  exit=$($row.Code) ================"
              $out = "per-file/" + [System.IO.Path]::GetFileNameWithoutExtension($row.File) + ".txt"
              if (Test-Path $out) { Get-Content $out -Tail 120 }
            }
          }

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preinstall-${{ matrix.python }}
          path: |
            docs/evidence/**
            suite.txt
            junit.xml
            exitcode.txt
            per-file/**
          if-no-files-found: ignore
