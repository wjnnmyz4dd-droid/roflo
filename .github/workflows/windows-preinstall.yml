# DeskPilot on Windows: the tests that cannot be run from Linux.
#
# Everything in `docs/deskpilot-windows-compatibility.md` marked
# UNVERIFIED ON WINDOWS is unverified because this workflow has never
# run. It exists so that the gap closes by being executed rather than by
# being argued about.
#
# It installs nothing on anybody's laptop and contacts no marketplace:
# the runner is disposable, egress stays simulated, and no credential is
# supplied to it.
name: windows-preinstall

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'solvent/**'
      - 'tests_solvent/**'
      - '.github/workflows/windows-preinstall.yml'

# One run per branch. Four Windows jobs competing for runners made
# every push slower than the one before it, and a superseded run's
# result is not evidence about the current commit anyway.
concurrency:
  group: windows-preinstall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-on-windows:
    name: Suite on Windows (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the installer enforces; 3.13 is what it
        # bootstraps. Both are run because a floor nobody tests is a
        # floor nobody knows holds.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Record the environment
        shell: pwsh
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform()); print('64-bit:', sys.maxsize > 2**32)"
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Output "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"

      # pytest is in the `dev` extra, not `verification`. Leaving it out
      # is what made the first three runs of this workflow fail at the
      # first test step with "No module named pytest" -- and the steps
      # after it were skipped, so the failure hid every other result.
      # tzdata alongside the extras, because Windows ships no IANA
      # timezone database and the installer carries this same package
      # for the same reason. Without it the suite measures a host no
      # installed DeskPilot will ever be.
      - name: Install the verification extras and the test runner
        run: |
          python -m pip install --disable-pip-version-check -e ".[verification,dev]"
          python -m pip install --disable-pip-version-check tzdata==2026.5

      # Which formats this Windows machine can give a second opinion on.
      # Recorded before the suite so it is in the log even when a test
      # fails: the T2 question is the one this workflow exists to settle.
      - name: Independent (T2) readers available on Windows
        if: always()
        shell: pwsh
        run: |
          python -c @"
          from solvent import independent
          for extension in sorted(independent._DIFFERENTIAL_READERS):
              report = independent.available(extension=extension)
              for producer in report.producers:
                  print(extension, '|', producer.name, '| usable=' + str(producer.usable),
                        '| needs_a_person=' + str(producer.needs_a_person),
                        '|', producer.why)
          "@

      # cmd.exe, not pwsh, and that is the point of this step's shape.
      #
      # The previous two attempts both lost the end of the run: the
      # tee'd version stopped at 60%, the redirected one at 65%, and in
      # both the step's own `Write-Output "pytest exit code: ..."`
      # never reached the archived log either. A shell that loses its
      # own echo after the command it ran is a shell whose buffer went
      # with it, so this run removes the shell from the path: cmd.exe's
      # `>` is an OS-level handle on the child process, written by
      # pytest itself with nothing in between to buffer.
      #
      # And the answer no longer depends on stdout at all. --junitxml
      # is written incrementally by pytest and names every test that
      # ran, so even a lost console says which test was last. The exit
      # code goes to a file in the same breath, because a code printed
      # to a stream that disappears is not evidence.
      - name: Full suite
        shell: cmd
        run: |
          python -I -m pytest tests_solvent -p no:randomly --color=no --tb=long -rf --junitxml=junit.xml > suite.txt 2>&1
          REM `echo %ERRORLEVEL%> file` writes nothing: cmd reads the
          REM digit immediately before `>` as a stream number, so the
          REM last run produced a file containing "ECHO is off." and
          REM the exit code was lost -- in the step built to stop
          REM losing it. Redirect first, echo second.
          >exitcode.txt echo %ERRORLEVEL%
          type exitcode.txt
          exit /b 0

      # Separate from the step above so the suite's own exit code
      # cannot stop the diagnosis. Everything measured here is read
      # from files pytest wrote, not from a console that may not have
      # survived.
      - name: What the suite actually did
        if: always()
        shell: pwsh
        run: |
          $code = if (Test-Path exitcode.txt) { (Get-Content exitcode.txt -Raw).Trim() } else { "no file" }
          Write-Output "pytest exit code: $code"
          if (Test-Path suite.txt) {
            $lines = @(Get-Content suite.txt)
            Write-Output "suite.txt: $($lines.Count) line(s), $((Get-Item suite.txt).Length) bytes"
            Write-Output "----- last line written -----"
            Write-Output $lines[-1]
          } else { Write-Output "suite.txt was never created" }
          if (Test-Path junit.xml) {
            [xml]$x = Get-Content junit.xml
            $suite = $x.testsuites.testsuite
            Write-Output ("junit: tests={0} failures={1} errors={2} skipped={3}" -f `
                          $suite.tests, $suite.failures, $suite.errors, $suite.skipped)
            $cases = @($suite.testcase)
            Write-Output "junit recorded $($cases.Count) case(s); last was:"
            Write-Output ("  {0}::{1}" -f $cases[-1].classname, $cases[-1].name)
          } else { Write-Output "junit.xml was never created -- pytest did not reach the end" }
          Write-Output "----- free disk and memory -----"
          Get-PSDrive C | Select-Object Used,Free | Format-List
          Get-CimInstance Win32_OperatingSystem |
            Select-Object FreePhysicalMemory,TotalVisibleMemorySize | Format-List
          if (Test-Path suite.txt) {
            Write-Output "----- suite.txt, last 80 lines -----"
            Get-Content suite.txt -Tail 80
          }
          # Four conditions, not one. "A partial run is not
          # certification", so a zero exit code on its own is not
          # enough: pytest must have reached the end and written a
          # junit summary, that summary must account for the whole
          # suite, and nothing in it may have failed or errored. A
          # run that dies after 300 green tests exits non-zero *and*
          # leaves no junit.xml; one that is cancelled can leave a
          # truncated one. Each is named separately so the log says
          # which held.
          $code = if (Test-Path exitcode.txt) { (Get-Content exitcode.txt -Raw).Trim() } else { "1" }
          $bad = @()
          if ($code -ne "0") { $bad += "pytest exit code was $code" }
          if (-not (Test-Path junit.xml)) {
            $bad += "no junit.xml: pytest did not reach the end"
          } else {
            [xml]$x = Get-Content junit.xml
            $suite = $x.testsuites.testsuite
            $ran = [int]$suite.tests
            $skipped = [int]$suite.skipped
            if ($ran -lt 5000) { $bad += "only $ran test(s) in the summary; this suite has thousands" }
            if ([int]$suite.failures -ne 0) { $bad += "$($suite.failures) failure(s)" }
            if ([int]$suite.errors -ne 0) { $bad += "$($suite.errors) error(s)" }
            Write-Output "COMPLETE RUN: $ran test(s), $skipped skipped, exit code $code"
          }
          if ($bad.Count -gt 0) {
            Write-Output "NOT A COMPLETE GREEN RUN: $($bad -join '; ')"
            exit 1
          }

      # Every step below runs even when the suite fails. A single red
      # test must not hide the Windows-only answers this workflow is
      # here to produce -- that is what happened on runs 1 to 3.
      - name: Windows invariants, on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_windows_compatibility.py -q

      - name: The installer's own suite
        if: always()
        run: python -I -m pytest tests_solvent/test_installer_python_bootstrap.py tests_solvent/test_installer_python_discovery.py -q

      - name: State paths resolve to a drive
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import ntpath
          from solvent import harness, runtime
          from solvent.web import intents
          for name, value in (('DEFAULT_DB', runtime.DEFAULT_DB),
                              ('HEARTBEAT_PATH', runtime.HEARTBEAT_PATH),
                              ('PAYMENT_SPOOL', harness.PAYMENT_SPOOL),
                              ('INTENT_SPOOL', intents.INTENT_SPOOL)):
              drive, _ = ntpath.splitdrive(value)
              print(name, value, 'drive=' + repr(drive))
              assert drive, name + ' is drive-relative on Windows: ' + value
          "@

      - name: Python discovery against the real machine
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, 'windows/installer')
          from deskpilot_installer import python_runtime
          from deskpilot_installer.host import WindowsHost
          host = WindowsHost()
          for how, where in python_runtime.search_report(host).items():
              print(how + ':', where)
          found = python_runtime.discover(host)
          for interpreter in found:
              print(interpreter.path, interpreter.version_text,
                    '64-bit' if interpreter.is_64bit else '32-bit',
                    interpreter.rejected or 'usable')
          chosen = python_runtime.choose(found)
          print('chosen:', chosen.path if chosen else 'none')
          assert chosen is not None, 'the runner has Python; discovery must find it'
          "@

      - name: Control centre starts and answers on loopback
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, '.')
          from solvent.web import server
          print('default host:', server.DEFAULT_HOST)
          assert server.DEFAULT_HOST == '127.0.0.1'
          "@

      # The scheduler, on Windows, actually ticking. Not a source read:
      # the business task is constructed and run, and its refusal is
      # printed. Simulation stays on and continuous operation stays off,
      # so this proves the wiring without doing any business.
      - name: The business scheduler ticks on Windows
        if: always()
        shell: pwsh
        run: |
          python -c @"
          import sys
          sys.path.insert(0, '.')
          from tests_solvent.fixtures import Rig
          from solvent.runtime import Runtime
          runtime = Runtime(Rig())
          runtime.default_tasks()
          names = [task.name for task in runtime.tasks]
          print('tasks:', names)
          assert names.count('business') == 1, names
          print('tick says:', runtime._tick_business())
          status = runtime.business_status()
          print('states:', sorted(status['states']))
          print('connected:', status['business_cycle_connected'],
                'enabled:', status['business_cycle_enabled'])
          "@

      - name: Five-skill smoke test on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_five_skill_library.py -q

      # The real production path, on Windows. The scheduler tick above
      # proves the task is wired; this proves a job goes all the way
      # through it on this operating system -- order, qualification,
      # Governor, Action Gate, worker, checker, delivery, invoice --
      # with nothing substituted. Without it, "Windows startup uses the
      # same real path" would be an assumption rather than a result.
      - name: The production path, end to end, on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_production_path.py -q

      # The chain Phase 9 draws, on Windows: Chief of Staff, discovery,
      # qualification, pricing, negotiation, proposal, contract, the
      # 20% deposit, Governor, Action Gate, the five skills, the
      # independent checker, delivery, invoice, reconciliation, CRM.
      - name: The whole business lifecycle, on Windows
        if: always()
        run: python -I -m pytest tests_solvent/test_business_lifecycle.py tests_solvent/test_chief_of_staff_certification.py -q

      # The files the suite actually failed in, re-run on their own and
      # with the tracebacks kept.
      #
      # Driven off junit.xml rather than by sweeping all ~200 files.
      # The sweep took twenty-five minutes to tell us what the record
      # pytest already wrote says in a second, and a diagnostic that
      # costs more than the run it diagnoses does not get used.
      #
      # Running each on its own still matters: a failure that only
      # happens in the combined run is a different animal from one
      # that happens alone, and the two need different repairs. When
      # junit lists failures and none of them reproduce in isolation,
      # that is itself the finding and this step says so.
      - name: The failing files on their own, with tracebacks
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path junit.xml)) {
            Write-Output "no junit.xml: the suite did not get far enough to say"
            exit 0
          }
          [xml]$x = Get-Content junit.xml
          $files = @($x.testsuites.testsuite.testcase |
                     Where-Object { $_.failure -or $_.error } |
                     ForEach-Object { $_.file } |
                     Where-Object { $_ } | Sort-Object -Unique)
          if ($files.Count -eq 0) {
            Write-Output "junit records no failing test; the non-zero exit came from somewhere else"
            exit 0
          }
          Write-Output "$($files.Count) file(s) contained a failure:"
          $files | ForEach-Object { Write-Output "  $_" }
          New-Item -ItemType Directory -Force -Path per-file | Out-Null
          foreach ($name in $files) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($name)
            $out = "per-file/$base.txt"
            cmd /c "python -I -m pytest $name -p no:randomly --tb=long -rf --color=no > $out 2>&1"
            $code = $LASTEXITCODE
            Write-Output ""
            Write-Output "================ $name  alone: exit=$code ================"
            if ($code -eq 0) {
              Write-Output "  passes on its own -- this failure needs the whole run"
            } elseif (Test-Path $out) {
              Get-Content $out -Tail 100
            }
          }

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preinstall-${{ matrix.python }}
          path: |
            docs/evidence/**
            suite.txt
            junit.xml
            exitcode.txt
            per-file/**
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # The installation itself, on a real Windows machine.
  #
  # Separate from the suite job on purpose. The suite proves the code
  # behaves on Windows; this proves the thing an owner actually runs
  # puts a working DeskPilot on a machine that did not have one. They
  # fail for different reasons and a reader needs to know which.
  #
  # Nothing here is a fake host. The payload is built by build.py, the
  # engine is driven through its own CLI with the same phases
  # DeskPilot-Setup.exe drives, and the filesystem is the runner's.
  # ------------------------------------------------------------------
  install-on-windows:
    name: Install on Windows (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      # Build machine and target machine are the same box here, which
      # is not how a release is built -- but the payload it produces is
      # byte-identical to one built anywhere, because `git archive` of
      # a commit and wheels pinned by SHA-256 are both deterministic.
      - name: Build the certified payload
        shell: pwsh
        run: |
          python windows/installer/build.py --payload-only `
            --out-dir "$env:RUNNER_TEMP/dist"
          Get-ChildItem "$env:RUNNER_TEMP/dist/stage" -Filter *.zip |
            ForEach-Object {
              Write-Output "payload: $($_.Name)  $($_.Length) bytes"
              "PAYLOAD=$($_.FullName)" >> $env:GITHUB_ENV
              "PAYLOAD_SHA=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
            }

      # The payload carries a wheel set for every interpreter the
      # installer might reuse -- cp311 through cp314 -- and only one
      # is for this job's. Asserted here because `step_vendor`
      # looking in the wrong place does not fail: it quietly installs
      # nothing, which is exactly what it did for three commits.
      - name: The payload carries every wheel set
        shell: pwsh
        run: |
          $names = (& python -c @"
          import zipfile, sys
          z = zipfile.ZipFile(sys.argv[1])
          print('\n'.join(n for n in z.namelist() if n.startswith('vendor/')))
          "@ $env:PAYLOAD) -split "`n"
          $wheels = $names | Where-Object { $_ -like "*.whl" }
          Write-Output "$($wheels.Count) wheel(s) in the payload"
          foreach ($tag in @("cp311","cp312","cp313","cp314")) {
            $n = ($names | Where-Object { $_ -like "vendor/wheels/$tag/*" }).Count
            Write-Output "  $tag : $n wheel(s)"
            if ($n -lt 10) { throw "the payload carries no $tag wheel set" }
          }
          if ($wheels.Count -lt 40) { throw "the payload carries too few wheels" }
          if (-not ($names -contains "vendor/t2-windows-x64.txt")) {
            throw "the payload carries wheels and no manifest to check them against"
          }

      # Whether the shipping artifact can be produced at all, which
      # is a separate question from whether the engine works. The
      # answer is reported either way rather than assumed: an
      # installer nobody has built is not an installer, and claiming
      # one without the build step having run would be exactly the
      # kind of statement this whole engagement keeps retracting.
      - name: Build DeskPilot-Setup.exe, or say why not
        if: matrix.python == '3.11'
        shell: pwsh
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            foreach ($guess in @("C:\Program Files (x86)\NSIS\makensis.exe",
                                 "C:\Program Files\NSIS\makensis.exe")) {
              if (Test-Path $guess) { $nsis = Get-Item $guess; break }
            }
          }
          if (-not $nsis) {
            # The hosted image no longer ships NSIS, so install it --
            # pinned, and through Chocolatey, which checks the package's
            # own SHA-256 against its manifest before unpacking it.
            #
            # This is a build-machine tool, not a product dependency: no
            # byte of it reaches an owner's machine or the payload. It is
            # the same category as the `pip download` in build.py, which
            # also runs here and nowhere else. The installer's own "no
            # downloads during an installation" rule is untouched, and
            # tests_solvent/test_installer_vendored_readers.py asserts it
            # on every run.
            Write-Output "NSIS is not on this runner; installing it to build the wizard."
            choco install nsis --version=3.11 --no-progress -y
            foreach ($guess in @("C:\Program Files (x86)\NSIS\makensis.exe",
                                 "C:\Program Files\NSIS\makensis.exe")) {
              if (Test-Path $guess) { $nsis = Get-Item $guess; break }
            }
          }
          if (-not $nsis) {
            Write-Output "NSIS could not be installed on this runner, so"
            Write-Output "DeskPilot-Setup.exe was not built here. The payload and the"
            Write-Output "engine are built and tested above; the wizard compile is the"
            Write-Output "one step this environment could not perform."
            "SETUP_EXE=none" >> $env:GITHUB_ENV
            exit 0
          }
          Write-Output "makensis: $($nsis.Source ?? $nsis.FullName)"
          $env:PATH = "$([System.IO.Path]::GetDirectoryName($nsis.Source ?? $nsis.FullName));$env:PATH"
          python windows/installer/build.py --out-dir "$env:RUNNER_TEMP/dist" --allow-dirty
          $exe = Join-Path $env:RUNNER_TEMP "dist/DeskPilot-Setup.exe"
          if (Test-Path $exe) {
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            Write-Output "built: $exe"
            Write-Output "bytes: $((Get-Item $exe).Length)"
            Write-Output "sha256: $hash"
            "SETUP_EXE=$exe" >> $env:GITHUB_ENV
            # Two assertions, because "a file appeared" is not a build.
            # It has to be a Windows executable, and it has to carry the
            # digest of the payload it is supposed to refuse to install
            # without -- which is the whole of the installer's supply
            # chain promise and is compiled in rather than shipped beside.
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "DeskPilot-Setup.exe is not a PE executable"
            }
            $built = Get-ChildItem "$env:RUNNER_TEMP/dist/stage" -Filter "DeskPilot-certified-*.zip" | Select-Object -First 1
            $want = (Get-FileHash $built.FullName -Algorithm SHA256).Hash.ToLower()
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if (-not $text.Contains($want)) {
              throw "the installer does not carry its payload's digest $want"
            }
            Write-Output "carries the payload digest: $want"
          } else {
            throw "makensis ran and produced no DeskPilot-Setup.exe"
          }

      - name: Install, for real, into a fresh root
        shell: pwsh
        env:
          DESKPILOT_SETUP_ANSWERS: >-
            {"owner_identity":"owner:ci","business_email":"owner@example.invalid",
             "web_password":"ci-only-not-a-real-secret-${{ github.run_id }}",
             "ai_kind":"none","components":{}}
        run: |
          $root = "$env:RUNNER_TEMP\DeskPilot"
          "DESKPILOT_ROOT=$root" >> $env:GITHUB_ENV
          python -I windows/installer/deskpilot-engine.py `
            install --root $root --package $env:PAYLOAD `
            --expect-sha256 $env:PAYLOAD_SHA `
            --out "$env:RUNNER_TEMP/install-report.json"
          Write-Output "engine exit code: $LASTEXITCODE"
          if (Test-Path "$env:RUNNER_TEMP/install-report.json") {
            Get-Content "$env:RUNNER_TEMP/install-report.json"
          }
          exit $LASTEXITCODE

      # Asked of Layout, which is what the installer itself joined the
      # path with. Two steps below used to spell it `data\deskpilot.db`
      # by hand; the installation writes `Data\solvent.db`, so on a
      # case-insensitive filesystem those steps quietly created a second,
      # empty database and then proved that *it* survived the uninstall.
      # A guard that invents the thing it guards proves nothing.
      - name: Where the installed database actually is
        if: always()
        shell: pwsh
        run: |
          $db = python -I -c "import sys; sys.path.insert(0, 'windows/installer'); from deskpilot_installer.layout import Layout; print(Layout(root=sys.argv[1]).db)" $env:DESKPILOT_ROOT
          if (-not (Test-Path $db)) { throw "the installation created no database at $db" }
          $bytes = (Get-Item $db).Length
          Write-Output "installed database: $db ($bytes bytes)"
          "DESKPILOT_DB=$db" >> $env:GITHUB_ENV
          "DESKPILOT_DB_BYTES=$bytes" >> $env:GITHUB_ENV

      - name: What the installation produced
        if: always()
        shell: pwsh
        run: |
          python -I tools/windows_install_check.py `
            --root $env:DESKPILOT_ROOT `
            --report "$env:RUNNER_TEMP/install-report.json" `
            --out "$env:RUNNER_TEMP/install-check.json"

      # The engine's own verification phase, which is what the wizard
      # runs on its last screen. Separate from the check above: that
      # reads the disk from outside, this asks DeskPilot about itself.
      - name: The installation verifies itself
        if: always()
        shell: pwsh
        run: |
          python -I windows/installer/deskpilot-engine.py `
            verify --root $env:DESKPILOT_ROOT `
            --headline "$env:RUNNER_TEMP/headline.txt" `
            --out "$env:RUNNER_TEMP/verify-report.json"
          Write-Output "verify exit code: $LASTEXITCODE"
          if (Test-Path "$env:RUNNER_TEMP/headline.txt") {
            Get-Content "$env:RUNNER_TEMP/headline.txt"
          }

      # Phase 7's restart requirement. Business state is written by one
      # process and read by another started from scratch, with a real
      # close in between -- and then read a third time to prove the
      # second did not duplicate anything.
      - name: Business state survives a restart
        if: always()
        shell: pwsh
        run: |
          python -I tools/windows_restart_check.py `
            --root $env:DESKPILOT_ROOT `
            --out "$env:RUNNER_TEMP/restart-check.json"

      # Phase 9 on the installed application, driven through the
      # entry points it ships rather than through a harness written
      # for the occasion. `solvent demo` is the complete-job harness
      # -- Governor, Action Gate, worker, independent checker,
      # delivery, invoice -- and `solvent run` is the real scheduler,
      # Chief of Staff tick included.
      #
      # The lower half of the chain is also proved separately by the
      # suite job, which runs test_production_path.py and
      # test_business_lifecycle.py on this same operating system.
      # What this step adds is that it happens on the *installed*
      # tree, with the installed interpreter.
      - name: The production runtime, on the installed application
        if: always()
        shell: pwsh
        run: |
          $py = Join-Path $env:DESKPILOT_ROOT "venv\Scripts\python.exe"
          $db = $env:DESKPILOT_DB
          if (-not (Test-Path $db)) { throw "no installed database at $db" }
          Write-Output "----- solvent health -----"
          & $py -I -m solvent.cli health --db $db
          Write-Output "----- solvent demo (the complete-job harness) -----"
          & $py -I -m solvent.cli demo
          $demo = $LASTEXITCODE
          Write-Output "demo exit code: $demo"
          Write-Output "----- solvent run, three real ticks -----"
          & $py -I -m solvent.cli run --db $db --max-ticks 3 --tick 0
          Write-Output "run exit code: $LASTEXITCODE"
          if ($demo -ne 0) { throw "the complete-job harness failed on the installed application" }

      # Uninstall keeps the owner's records unless they say otherwise,
      # and the engine proves that by checking the kept paths after the
      # deletions rather than restating the promise.
      - name: Uninstall keeps the business records
        if: always()
        shell: pwsh
        run: |
          python -I windows/installer/deskpilot-engine.py `
            uninstall --root $env:DESKPILOT_ROOT `
            --out "$env:RUNNER_TEMP/uninstall-report.json"
          Write-Output "uninstall exit code: $LASTEXITCODE"
          $db = $env:DESKPILOT_DB
          if (-not (Test-Path $db)) {
            throw "uninstall destroyed the business records without being asked"
          }
          $after = (Get-Item $db).Length
          Write-Output "KEPT: $db ($after bytes, was $env:DESKPILOT_DB_BYTES)"
          if ($after -lt [int]$env:DESKPILOT_DB_BYTES) {
            throw "the database shrank across the uninstall: $env:DESKPILOT_DB_BYTES -> $after bytes"
          }

      - name: Upload the installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/install-report.json
            ${{ runner.temp }}/install-check.json
            ${{ runner.temp }}/verify-report.json
            ${{ runner.temp }}/restart-check.json
            ${{ runner.temp }}/uninstall-report.json
            ${{ runner.temp }}/headline.txt
            ${{ runner.temp }}/dist/DeskPilot-Setup.exe
          if-no-files-found: ignore
